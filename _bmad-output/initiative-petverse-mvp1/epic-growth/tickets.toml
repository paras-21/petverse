description = "Runs the epic's Done when end to end on the final 46630 deployment and the Vercel app as a scripted checklist, with stage levels lowered through the Safe and timelock for the drill and restored to 3, 6, 15 and 30 after: a pet grows Baby → Teen with its path → Adult and its element look shows on the Home stage; one reaches Elder with a bought item and one reaches Mythic with a Mythic item and a season trophy won in a shortened test season; an own-pets breed and a Co-Pet breed with both approvals at the doubling cost; each breed's egg, shiny flag included, is recomputed from its revealed seed with entry 2's breedOutcome; the Evolve and Breed sheets show every state in EXPERIENCE.md's spine."
