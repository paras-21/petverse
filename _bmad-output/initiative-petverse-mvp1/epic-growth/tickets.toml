# tickets.toml — epic-growth's agreed entries in build order. tickets.py reads it.
# The order of the tables is the build order; `id` names an entry for good and is never reused.
# Requirement ids are the spec's CAP-16 (Evolution) and CAP-17 (Breeding); numbers are in game-rules.md, Growth.
# Assumed numbers and choices are dated Decision lines in epic-growth.md Notes (DECISIONS #31).

[[entry]]
id = 1
type = "story"
title = "Tracer: a pet's Teen path and stage from chain to the Home badge and 3D stage"
description = "Delivers the thinnest path through every layer the epic touches: a PetCore upgrade that fixes the path (Warrior, Guardian or Explorer from the battle, care and expedition counters, ties to Guardian then Warrior) in the same call that first takes the pet to level 3, with pets already past level 3 getting theirs on their next touch; a new upgradeable Evolution module whose stageOf view returns Baby, Teen (level 3) or Adult (level 6) from level, with the stage levels as timelocked parameters (AD-18) that a drill may lower and restore; the Ignition module, Blockscout verification and generated chain module for both; the indexer projecting PathSet and the stage into the Pet table; and Home showing \"Bunny · Lv 6 · Adult\" with the Warrior / Guardian / Explorer path and the existing baby or adult 3D form chosen by stage, a mapping entry 4 replaces with a stage prop."
verify = "On 46630, with the Teen and Adult levels lowered for the drill through the Safe and timelock and restored after, a test pet fed and fought past each level shows on the Vercel Home badge as Teen with its path and then Adult in the adult 3D form within a minute of each level-up, and the PathSet event and stageOf view on Blockscout agree with it."
covers = ["CAP-16"]
after = ["9.13"]
hitl = true
risk = "high"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-2-petcore-is-the-single-ledger-modules-are-spokes",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-3-upgradeable-modules-behind-a-safe-proposed-timelock",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-21-contract-addresses-and-abis-reach-src-through-one-generated-module",
]

[[entry]]
id = 2
type = "story"
title = "Breeding module: eligibility, doubling cost, commit-reveal egg with inherited traits and 1 in 500 shiny"
description = "Delivers CAP-17's on-chain rules as an upgradeable Breeding module tested on Hardhat's in-process network: two awake parents at level 6+ with good care in the current 24-hour window, each the caller's own pet or a Co-Pet the caller co-owns with its partner's one-use on-chain approval (AD-17), at most 5 breeds per parent and a 24-hour cooldown per parent, cost $2.99 × 2^(the higher parent's breed count) in PETV through the price source and the Store's egg payment split, then a Randomness request whose settle mints an egg to the caller with species and element 45% parent A / 45% parent B / 10% any, a random coat of that species and shiny when seed mod 500 = 0, a timeout no-op that refunds the PETV, leaves counts and cooldowns unchanged and emits BreedRefunded, and a pure TS breedOutcome(seed, parents) port the contract matches by shared vectors, which entry 10 and epic-launch's \"Check this result\" also use; any PetCore hook it needs (egg mint with given traits, care-window view) builds on entry 1's PetCore upgrade."
verify = "The chain/ contract tests show a valid breed mints the predicted egg from the revealed seed (matching breedOutcome), refusals for a non-adult, a pet without good care, a 6th breed, a parent in cooldown, a stranger's pet and a Co-Pet without its partner's approval, costs of 1×, 2×, 4×, 8×, 16× $2.99, a timed-out request refunding in full, and between 150 and 250 shiny eggs in a seeded breedOutcome run of 100,000 seeds."
covers = ["CAP-17"]
after = [1, "8.3"]
hitl = false
risk = "high"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-6-commitreveal-randomness-bound-per-request-no-chain-entropy",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-10-dollar-pricing-through-one-price-source-port-with-bounded-signers",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-17-co-pet-ownership-is-on-chain",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-18-every-economy-number-is-a-parameter-with-one-home",
]

[[entry]]
id = 3
type = "story"
title = "Evolution to Elder and Mythic with their items and the trophy check"
description = "Extends entry 1's Evolution module with evolve(petId) for an awake pet: Elder needs level 15 and burns one soulbound Elder item from the caller, Mythic needs Elder, level 30, burns one Mythic item and needs the caller (either owner of a Co-Pet) to hold a season trophy of any season, named by its token id and checked against the per-season trophy ids (top-10% finish, not raid cosmetics) that epic-cosmetics-market defines and epic-seasons 10.8 registers each season, minted by 10.3, which is not used up; the Elder and Mythic items are new soulbound ids in the Cosmetics ERC-1155 that the Store mints on purchase ($3 and $5), and stageOf now returns Elder and Mythic; the Elder and Mythic levels are timelocked parameters like entry 1's."
verify = "The chain/ contract tests show Elder and Mythic succeed only for an awake pet with level, item and (Mythic) a season trophy in place, a raid cosmetic does not count as a trophy, each burns exactly one item, a failed evolve keeps the item, the items cannot be transferred, and stageOf returns the new stage."
covers = ["CAP-16"]
after = [1]
hitl = false
risk = "medium"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-22-transfer-rules",
]

