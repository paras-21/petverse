title = "Indexer projections and the pet growth read for evolution and breeding"
description = "Extends the indexer with Evolved, BreedRequested, BreedSettled and BreedRefunded into the Pet table (stage, path, element, shiny, parent ids, breeds used, cooldown end) and adds the read that the Evolve and Breed sheets use: next stage and what it needs, owned item counts, eligible partners among the player's own pets and Co-Pets, breeds left and the next breed's dollar cost read from contract views (AD-18)."
verify = "Worker and API tests on the Hardhat local-node fixture evolve one pet, breed two and let one breed time out, then show the projected rows and the read's next stage, breeds left, eligible partners and next cost matching the contract views, with a restart mid-sync leaving no duplicate rows."
