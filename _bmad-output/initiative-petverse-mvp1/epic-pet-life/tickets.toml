title = "Burial: the keeper buries due pets, burns the NFT, mints the Tombstone and gives a free egg"
description = "Adds PetCore.bury (anyone, at or after deathAt; also reached through touch): run sleep first, call the named recycle point where epic-pot returns owed ETH to the pot and the Gold-counter delete that epic-petv extends, burn the PetNFT, mint the soulbound Tombstone through entry 5, and issue a free-egg right that lets the voucher route sign one more free egg for that DID; plus the keeper job in the worker, holding a KEEPER key granted here through the timelock, that buries every due pet and reports its backlog on the health route (AD-23), and the PetBuried projection that marks the Pet row dead."
verify = "Contract tests show bury reverts one second before deathAt and succeeds at it, the NFT is gone, the pet's pot points are removed, and the owner holds a non-transferable Tombstone, and a worker test on a local node shows the keeper burying a due pet after time travel, after which the same login gets a voucher and hatches a free egg."
