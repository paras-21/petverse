# tickets.toml — epic-pet-life's agreed entries in build order. tickets.py reads it.
# The order of the tables is the build order; `id` names an entry for good and is never reused.
# Requirement ids (CAP-1, CAP-3 to CAP-6) are in spec-petverse/spec-petverse.md, Capabilities.
# Lane A (chain/, worker, indexer, prisma, server voucher route): 1 → 2 → 4 → 5 → 6 → 7 → 11.
# Lane B (UI: src/app, src/components): 3 → 9 → 8 → 10. Entry 9 owns the route that picks Landing / Egg / Home; 8 changes only the Home screen.

[[entry]]
id = 1
type = "story"
title = "Tracer: log in, hatch the free egg on 46630 and see the pet on Home"
description = "Delivers the thinnest path through every layer of the epic: upgradeable PetCore and PetNFT on the governance base (PetNFT minted and burned only by PetCore, every other transfer reverts), a hatch call carrying a VOUCHER_SIGNER voucher bound to the Privy DID (the contract caps free eggs per DID hash) and a Randomness commitment whose reveal settles species, coat (an index into `SPECIES_PALETTES[species]` in src/lib/pets.ts) and element (one of fire, water, leaf, spark, stone, drawn at the reveal), the indexer handler that projects PetHatched into a Pet row (first Pet model, indexer as its single writer), and the login → egg → Home screens rendering that pet with the existing EggModel and PetModel."
verify = "With app and worker running locally against 46630, a fresh email login taps the egg and Home shows the pet whose species and coat match the PetHatched event and the indexed Pet row, and a second free-egg request for the same login is refused."
covers = ["CAP-1", "CAP-3"]
after = ["1.8", "1.11", "1.12", "1.15", "1.16"]
hitl = true
risk = "high"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-12-one-schema-one-writer-per-table-the-indexer-owns-projections",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-21-contract-addresses-and-abis-reach-src-through-one-generated-module",
  "_bmad-output/initiative-petverse-mvp1/ux-petverse/.working/key-landing-hatch.html",
  "src/lib/pets.ts",
]
notes = [
  "hitl steps: the owner OKs the PetCore and PetNFT deploy to 46630 (CLAUDE.md); the Safe grants GAME_MODULE / VOUCHER_SIGNER wiring through the timelock; the owner creates and funds the VOUCHER_SIGNER key and enters it in the local env and the host secret store; the owner adds PetCore to the Gas Manager policy allow-list.",
  "High risk: outside check = the owner repeats the login and hatch on their own phone browser and confirms the hatch and reveal transactions on the explorer.",
]

[[entry]]
id = 2
type = "story"
title = "PetCore life cycle: sleep, wake loss, death and new-pet protection from one timestamp"
description = "Adds to PetCore the AD-16 rule (sleepAt, deathAt = sleepAt + 7 days, dead at exactly deathAt), the anyone-callable sleep, wake with the 10%-per-day pot-point cut that leaves level and lifetime points untouched, touch returning Status so a module that gets Dead ends with no state change, per-pet pot points and lifetime points with a GAME_MODULE awardPoints that gives an asleep pet nothing, the 3-day new-pet protection timestamp, the shield-until field and view (epic-store-pass 5.6 adds its one setter, which it sells and epic-battle 6.3 calls), per-pet care, battle and expedition counters with a GAME_MODULE increment (entry 4, epic-battle and epic-play-hub call it), the accrued-Gold counter epic-petv pays and deletes, a GAME_MODULE feed setter that entry 4's Care calls, and named empty settle points where epic-pot plugs the bucket settlement; plus the TS status port in src/lib and a shared JSON vector file both test suites read."
verify = "Contract tests pin asleep at exactly sleepAt, dead at exactly deathAt, wake loss day 1 = 10% to day 7 = 70% with level and lifetime points unchanged, protection ending at exactly 3 days, and awardPoints adding pot and lifetime points to an awake pet and nothing to an asleep one, and the TS status port's test passes the same vector file."
covers = ["CAP-3", "CAP-5", "CAP-6"]
after = [1]
hitl = false
risk = "high"
owns = ["chain/contracts/PetCore.sol", "chain/contracts/interfaces/IPetCore.sol", "chain/test/vectors/status-vectors.json", "src/lib/status.ts", "src/lib/status.test.ts", "src/lib/chain/**"]
test = "chain/test/PetCore.lifecycle.test.ts"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-4-pot-accounting-is-a-two-level-masterchef-accumulator-over-per-owner-effective-points",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-20-test-strategy",
]
notes = ["High risk: outside check = the adversarial review in the gate (DECISIONS #2) on the status boundaries and the wake cut."]

[[entry]]
id = 3
type = "story"
title = "Pet Press UI kit and app shell"
description = "Sets up the shared UI layer every screen of this and later epics uses: DESIGN.md colour and type tokens for the Pet Press theme (DECISIONS #58; token names unchanged) with Bricolage Grotesque (display) + Figtree (body) + Silkscreen (money, timers, stats, rarity tags only) via next/font/google replacing Baloo 2 + Nunito and the prototype pixel fonts, the Print effects setting (default on; off = flat colour, keeps ink outlines and hard shadows), the Night Arcade skin tokens for battle, Death Match and raid screens only, the chunky SVG icons this epic needs, pill / cooldown / text buttons, die-cut card (3px ink outline, hard offset shadow), number blob, timer chip, status and alert pills, pet badge, blob stage around the existing Stage, bottom sheet, step chip with progress dots, focus ring, a copy check that fails on the banned crypto words (EXPERIENCE Voice and Tone), and the top bar with avatar plus the phone tab bar / desktop top nav carrying only the Home tab (later epics add theirs). The 3D pets get an ink outline (inverted hull) and a halftone dot ground-shadow under the feet, with no post-processing passes on the 3D canvas."
verify = "A kit page run locally at 390px and 1280px shows every listed component as DESIGN.md specifies, with the 3px ink focus ring reaching each one by Tab, the copy check fails on a planted \"gas\" string in a screen, and typecheck and lint pass."
covers = []
after = [1]
hitl = false
risk = "low"
owns = ["src/components/ui/**", "src/components/ui.tsx", "src/components/shell/**", "src/app/layout.tsx", "src/app/globals.css", "src/app/kit/**", "scripts/copy-check.mjs", "src/components/three/PetModel.tsx", "src/components/three/jelly.tsx", "src/components/three/Stage.tsx"]
test = "src/components/ui/copy-check.test.ts"
references = ["_bmad-output/initiative-petverse-mvp1/ux-petverse/DESIGN.md", "docs/DECISIONS.md"]
notes = ["DECISIONS #58: Pet Press replaces the Petverse Candy look (direction-candy.html is superseded). Owns widened (2026-10-15, recommended default) to PetModel.tsx, jelly.tsx and Stage.tsx for the 3D ink outline (inverted hull) and the halftone ground-shadow decal; no post-processing on the 3D canvas."]

[[entry]]
id = 4
type = "story"
title = "Care: feeding spends a meal, resets the timer and earns points; the tutorial win"
description = "Adds the Care module as a GAME_MODULE: feed spends one meal from the owner's food balance kept in PetCore (which epic-store-pass and epic-play-hub later credit), calls entry 2's feed setter so the timer resets or the pet wakes with its cut, awards the feed points, counts the care action on the pet, grants the starter meals with the first hatch, and offers a one-time deterministic tutorial bot win per pet with no randomness (AD-6); the indexer projects PetFed and the food balance."
verify = "Contract tests show a feed sets sleepAt to now + 3 days, adds the feed points, spends one meal and increments the care count, a feed with no meal reverts, a feed on an asleep pet wakes it with that day's cut, and the tutorial win succeeds once per pet and never loses."
covers = ["CAP-1", "CAP-4", "CAP-5"]
after = [2]
hitl = false
risk = "medium"
owns = ["chain/contracts/Care.sol", "chain/contracts/interfaces/ICare.sol", "chain/contracts/PetCore.sol", "chain/ignition/modules/Petverse.ts", "src/worker/indexer/handlers/PetFed.ts", "src/worker/indexer/handlers/Food*.ts", "prisma/schema.prisma", "prisma/migrations/**", "src/lib/chain/**"]
test = "chain/test/Care.test.ts"
unknown = "Owner sets the economy numbers: points per feed (EXPERIENCE copy shows +20), starter meals at hatch (copy shows 2 free meals), whether free meals refill, and the tutorial win's points (if any)."

