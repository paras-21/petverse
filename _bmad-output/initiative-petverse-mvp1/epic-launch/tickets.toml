description = "Adds to entry 4's harness a reconciliation check that, for a sample of pets and players, compares the app's API values (points, pot size, pending share, claims from 3.10, burn total and Gold figures from 4.7's route) with the contract views they come from, and runs epic-pot's rebuild script (3.6) over every posted epoch of every stream to recompute root and datasetHash from the public dataset route alone."
verify = "On a Hardhat local node seeded by its own fixture (pets, a pot flush, a claim, a burn and one posted epoch) the check passes, fails on a planted off-by-one in one API value and on a tampered dataset leaf, and against 46630 it prints a report with every posted root rebuilt."
covers = ["CAP-28"]
after = [4]
hitl = false
owns = ["scripts/launch/check-reconcile.ts", "scripts/launch/check-epoch-roots.ts", "scripts/launch/check-reconcile.test.ts", "scripts/launch/fixtures/reconcile/**"]
test = "scripts/launch/check-reconcile.test.ts"
risk = "medium"
references = ["_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-5-ranked-and-bottom-half-payouts-go-through-one-epoch-merkle-distributor"]

