# tickets.toml — epic-launch's agreed entries in build order. tickets.py reads it.
# The order of the tables is the build order; `id` names an entry for good and is never reused.
# Requirement source: spec CAP-28 (spec-petverse.md) plus the epic's Done when (ops alarms, runbooks, launch), which
# have no CAP id; those entries carry covers = [] and name the Done when item and AD section they deliver.
# Lanes (never touch the same code):
#   A = fairness check route + sheet in src/ (1 → 2 → 3 → 6)
#   B = launch check scripts in scripts/launch/ (4 → 5)
#   C = worker ops alarms + team dashboard (7 → 8 → 9)
#   D = runbooks in docs/runbooks/ and their Safe helper scripts in chain/scripts/ (10 → 11)
#   closing: 12 Refactor sweep → 13 end-to-end suite → 14 final deploy + smoke → 15 launch checklist and opening.
# hitl steps per entry are listed in epic-launch.md Notes.

[[entry]]
id = 1
type = "story"
title = "Tracer: \"Check this result\" for one battle result, from Randomness events to the sheet on Vercel"
description = "Delivers the thinnest path through every layer the fairness check touches: a public, unauthenticated route that, for one requestId, reads epic-platform's Randomness service (1.16) register and reveal events (commitment, registering tx and time, secret, reveal tx and time) and the module's settle event, recomputes keccak(secret) = commitment and seed = keccak(secret, requestId), and returns match / pending / timed-out; and the DESIGN fairness-check sheet (\"Locked in before the fight\", \"Revealed after\", lime \"Matches\", \"Being revealed · nothing for you to do\", \"See it on the public record\" Blockscout link) opened from the battle result card's \"Check this result\" link, for battle results only."
verify = "On the Vercel production app on 46630, after one attack the result card's \"Check this result\" opens a sheet with lock-in and reveal times and \"Matches\" with a Blockscout link, and a local-node route test with a tampered reveal returns no match."
covers = ["CAP-28"]
after = ["6.12"]
hitl = true
risk = "medium"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-6-commitreveal-randomness-bound-per-request-no-chain-entropy",
  "_bmad-output/initiative-petverse-mvp1/ux-petverse/DESIGN.md",
  "_bmad-output/initiative-petverse-mvp1/ux-petverse/EXPERIENCE.md",
]

[[entry]]
id = 2
type = "spike"
title = "Can every random result type be recomputed from its published commitment and reveal alone?"
description = "Answers, for entry 3, which of the nine result types (battle, wheel, dice, wager, monster, expedition, egg, breeding, cosmetic drop) can be recomputed from the revealed seed plus public on-chain inputs — through a pure contract view, the settle event, or only a TS port — and which need a module change, by reading each module's contract and events on 46630."
verify = "A write-up in epic-launch/ lists each of the nine result types with its recompute path, the inputs it needs and one recomputed 46630 result that matches the settled outcome, recorded as a dated decision in epic-launch.md Notes."
covers = ["CAP-28"]
after = ["11.10"]
hitl = false
risk = "high"
unknown = "If a module emits neither the outcome inputs nor a pure outcome view, does the fix go back to that module's epic as a new entry or into this epic (recommended: back to the owning epic)?"

[[entry]]
id = 3
type = "story"
title = "\"Check this result\" works for all nine result types and the claim sheet"
description = "Extends entry 1's route and sheet to recompute the outcome itself (not only the commitment) for every result type by spike 2's paths, places the link on every result surface the spine names plus monster, expedition, egg-hatch, breeding and cosmetic-drop results, takes over epic-pot's claim-sheet link (3.8, which links to the public share views until then) with a PetCore public-view check, and covers the sheet's Loading, Error, Offline and timed-out states (timed-out copy is an assumption, see Notes)."
verify = "Route tests on a Hardhat local node with the full Ignition module recompute and match one settled result of each of the nine types, report a mismatch for a tampered seed and a no-op for a timed-out request, and on 46630 the sheet shows \"Matches\" for one real result of each type."
covers = ["CAP-28"]
after = [1, 2]
hitl = false
owns = ["src/server/fairness/**", "src/app/api/fairness/**", "src/components/fairness/**", "src/components/battle/ResultCard.tsx", "src/components/play/**/*Result*.tsx", "src/components/pot/ClaimSheet.tsx", "src/components/EggScreen.tsx", "src/components/home/BreedSheet.tsx", "src/components/shop/CosmeticDropResult.tsx"]
test = "src/server/fairness/recompute.test.ts"
risk = "high"
references = ["_bmad-output/initiative-petverse-mvp1/ux-petverse/EXPERIENCE.md"]

[[entry]]
id = 4
type = "story"
title = "Launch check: every release-1 contract is verified and governed as AD-3 says"
description = "Adds the launch-check script harness (node, read-only, any chainId) and its first check, which walks every address in the generated chain module and confirms Blockscout shows verified source, every proxy's upgrade admin and parameter setter is the TimelockController with the Safe as sole proposer and canceller, the Safe holds PAUSER, each server key holds exactly one role, and PETV has no minter, writing a pass/fail report other checks (5, 14) reuse."
verify = "Run against a Hardhat local node with the full Ignition module, the check passes, and it fails naming the contract when a planted extra role grant, a non-timelock admin or an unverified address is introduced; run against 46630 it prints a report."
covers = ["CAP-28"]
after = ["11.10"]
hitl = false
owns = ["scripts/launch/harness.ts", "scripts/launch/report.ts", "scripts/launch/check-governance.ts", "scripts/launch/check-governance.test.ts", "scripts/launch/fixtures/governance/**"]
test = "scripts/launch/check-governance.test.ts"
risk = "medium"
references = ["_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-3-upgradeable-modules-behind-a-safe-proposed-timelock"]

