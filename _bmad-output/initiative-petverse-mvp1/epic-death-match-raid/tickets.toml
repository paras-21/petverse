title = "Death Match weekend leaderboard, Hall of Fame data and the desktop lobby"
description = "Adds the weekend leaderboard and per-season Hall of Fame (best streaks of pets that left safely) as projections and one public API route that epic-seasons' Season page reuses, plus the desktop lobby (choose a pet, reward ladder, time left, leaderboard, Hall of Fame) and the phone leaderboard / Hall of Fame view."
verify = "A worker and API test on a local node with three scripted runs returns the leaderboard by points and a Hall of Fame holding only the safe exit, and the lobby renders them at 1280px with the reward ladder computed from the contract's parameters."
covers = ["CAP-13"]
after = [2]
hitl = false
