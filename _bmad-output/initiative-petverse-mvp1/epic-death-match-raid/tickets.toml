[[entry]]
id = 4
type = "story"
title = "Boss Raid module: a season boss whose health is shared by every raid"
description = "Adds the Raid GAME_MODULE on epic-battle's fight engine: one boss per season (from SeasonPass.seasonOf) with the assumed health, teams of 1 or 2 formed on-chain when the invited partner joins, one raid per pet per UTC day, damage from the fight lowering the shared health and awarding points and Gold per pet through epic-play-hub 9.2's awardGold, raids closed once health reaches 0 until the next season, and per-season team damage totals readable for the trophies stream."
verify = "Contract tests show two teams' raids lowering one shared health total, points and Gold per damage at the assumed rates, a second raid the same day reverting, a raid after health 0 refused, and team totals reset at a new season."
covers = ["CAP-20"]
after = ["9.2", "9.3", "6.1", "5.10", "1.16"]
hitl = false
risk = "high"
owns = ["chain/contracts/Raid.sol", "chain/contracts/interfaces/IRaid.sol", "chain/ignition/modules/Raid.ts", "chain/test/Raid.test.ts", "src/lib/chain/**"]
test = "chain/test/Raid.test.ts"

[[entry]]
id = 5
type = "story"
title = "Boss Raid card, partner finding, raid fight and top-team results for the trophies stream"
description = "Builds the Boss Raid card (\"Team of 2\", \"Season boss 62%\" progress bar, \"you dealt 1,240 damage\"), invite-a-friend and \"Finding a match…\" random-partner pairing (a raid mode on epic-battle 6.4 MatchQueue, on-chain join) with \"Stop looking\" and the Empty state when no partner comes (card stays on \"Find a partner\", nothing spent) and the Error state when a raid fails to start, the self-playing raid fight and reward card, and a tested worker function that ranks the season's top raid teams into trophies-stream leaves naming the raid prize item (a Raid parameter, assumed in Notes), which epic-seasons' trophies epoch builder includes."
verify = "On a local node two test players pair, raid and both see the shared boss bar drop and their reward card, a lone searcher who stops looking sees the Empty state with nothing spent, a failed raid shows the Error state, and a worker test turns a scripted season's raids into top-team leaves whose order and item id match the contract's team totals."
covers = ["CAP-20"]
after = [4, "6.4", "6.8", "7.3"]
hitl = false
risk = "medium"
owns = ["src/app/(game)/play/raid/**", "src/components/raid/**", "src/lib/raid/**", "src/server/matchmaker/raid.ts", "src/worker/epoch/raid-trophies.ts", "src/worker/epoch/raid-trophies.test.ts"]
test = "src/worker/epoch/raid-trophies.test.ts"

[[entry]]
id = 6
type = "story"
title = "Death Match and Boss Raid live on 46630: modules deployed, roles granted, both events checked"
description = "After the owner OKs each deploy (CLAUDE.md) and the Safe signers sign, deploys and verifies DeathMatch and Raid on 46630 on top of epic-play-hub 9.13's live PetCore play upgrade through Safe-proposed timelocked actions (GAME_MODULE, the Randomness consumer role and the CoPetApprovals consumer role for DeathMatch), regenerates the chain module, ships the app and worker to Vercel and Render, and runs a Death Match on a shortened-window test parameter and one Boss Raid live."
verify = "On the Vercel production app against 46630 a test pet enters a Death Match in the shortened window, wins, loses a life and leaves safely onto the leaderboard and Hall of Fame route, a Co-Pet is refused with one approval and enters with two, two test players raid the season boss and see the shared health drop, and DeathMatch and Raid show verified source on Blockscout."
covers = ["CAP-13", "CAP-20"]
after = [3, 5, "9.13", "8.12"]
hitl = true
risk = "high"
unknown = "Does the owner accept the assumed Death Match and Boss Raid numbers in epic-death-match-raid.md Notes (window, boss health, damage reward rates, raid prize item) before they go live?"
notes = [
