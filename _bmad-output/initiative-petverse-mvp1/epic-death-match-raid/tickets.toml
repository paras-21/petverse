# tickets.toml — epic-death-match-raid's agreed entries in build order. tickets.py reads it.
# The order of the tables is the build order; `id` names an entry for good and is never reused.
# Requirement ids are the spec's CAP ids (spec-petverse.md); numbers marked "assumption" are in epic-death-match-raid.md Notes.
# Entries 1–5 were epic-play-hub 8–12 before the 2026-10-14 split (content kept; ids renumbered from 1).

[[entry]]
id = 1
type = "story"
title = "Death Match module: weekend window, 3 lives, survivor streak, safe leave"
description = "Adds the DeathMatch GAME_MODULE on epic-battle's fight engine: entry only Saturday 00:00 – Sunday 23:59:59 UTC for an awake, not-away pet of level 6+ with lives left, one run per pet per weekend and at most 20 fights per pet per weekend (DECISIONS #57, a timelocked parameter), with epic-play-hub 9.2's inDeathMatchRun set on entry and cleared on leave, death or close, a Co-Pet only with both owners' epic-social approvals (used once); each win against another entered pet within ±2 levels adds 1 to the streak and awards 2× the ranked duel points × the streak (max 5×), each loss calls epic-play-hub 9.2's loseLife (0 lives = death); leave is allowed between fights at any time and keeps the points, and the keeper closes open runs as safe exits after the window."
verify = "Contract tests pin the window edges (Friday 23:59:59 refused, Saturday 00:00 open, Monday 00:00 refused), adult-only entry, the reward ladder 2×/4×/6×/8×/10× capped at 5×, a loss at 1 life burying the pet, a safe leave keeping points, a Co-Pet refused with one approval and accepted with two, a 21st fight in one weekend refused, and a reveal timeout leaving lives and streak unchanged."
covers = ["CAP-13"]
after = ["9.2", "9.3", "6.1", "8.3", "1.16"]
hitl = false
risk = "high"
owns = ["chain/contracts/DeathMatch.sol", "chain/contracts/interfaces/IDeathMatch.sol", "chain/ignition/modules/DeathMatch.ts", "chain/test/DeathMatch.test.ts", "src/lib/chain/**"]
test = "chain/test/DeathMatch.test.ts"
references = ["_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-17-co-pet-ownership-is-on-chain"]

[[entry]]
id = 2
type = "story"
title = "Death Match card, entry warning with type-the-name confirm, run and \"Leave safely?\""
description = "Builds the Death Match card (3 lives, \"Your pet can pass away at 0 lives.\", \"Leave safely any time.\", \"Opens in 2d 6h\" closed state, adults-only and \"Waiting for Ria\" Co-Pet states), the entry warning sheet that enables Enter only after the pet's name is typed, the run screen (hearts, streak, next multiplier, fight log, always-visible \"Leave now and keep rewards\"), the last-life \"Leave safely?\" sheet that never times out, and \"Mochi passed away.\" leading to the Tombstone, from entry 1's handler."
verify = "On a local node with the clock at Saturday a test player enters only after typing the pet's name, wins, loses to 1 life and is stopped by the \"Leave safely?\" sheet, leaves and sees the kept points; an accessibility test shows focus on each sheet title and that the sheet never closes on a timer."
covers = ["CAP-13"]
after = [1, "6.8"]
hitl = false
risk = "medium"
owns = ["src/app/(game)/play/death-match/page.tsx", "src/app/(game)/play/death-match/run/**", "src/components/death-match/DeathMatchCard.tsx", "src/components/death-match/EntryWarningSheet.tsx", "src/components/death-match/RunScreen.tsx", "src/components/death-match/LeaveSafelySheet.tsx", "src/components/death-match/DeathMatchFlow.test.tsx", "src/lib/death-match/**"]
test = "src/components/death-match/DeathMatchFlow.test.tsx"
references = ["_bmad-output/initiative-petverse-mvp1/ux-petverse/.working/key-death-match.html"]

[[entry]]
