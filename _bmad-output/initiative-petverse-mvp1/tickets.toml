# tickets.toml — the epics of initiative-petverse-mvp1 in build order. tickets.py reads it.
# The order of the tables is the build order; `id` names an epic for good and is never reused.
# `after` says what each epic needs and from which epic; the entries that wait on it carry the `after` at inception.

[[epic]]
id = 1
slug = "epic-platform"
title = "Platform baseline, governance and spikes"
covers = ["CAP-30"]

[[epic]]
id = 2
slug = "epic-pet-life"
title = "Log in, hatch and keep a pet alive"
covers = ["CAP-1", "CAP-3", "CAP-4", "CAP-5", "CAP-6"]
after = [
  { epic = 1, needs = "tracer path (login, 7702 smart account, sponsored call, indexer, generated chain module), governance base, Randomness service, Privy server auth, schema-per-environment" },
  { epic = 1, needs = "spike answers: wallet modes on 46630 and commit–reveal worker" },
]

[[epic]]
id = 3
slug = "epic-pot"
title = "Points, pot share and claim"
covers = ["CAP-7", "CAP-8", "CAP-9"]
after = [
  { epic = 2, needs = "PetCore with per-pet points, sleep/wake/bury hooks and the AD-16 status port" },
  { epic = 1, needs = "spike answer: per-owner two-level pot accumulator invariant" },
]

[[epic]]
id = 4
slug = "epic-petv"
title = "PETV token, trade tax, burns and Gold vault"
covers = ["CAP-22", "CAP-24"]
after = [
  { epic = 3, needs = "PotFunder to receive the trade-tax pot share" },
  { epic = 2, needs = "PetCore accrued-Gold counter to pay through GoldVault.creditFromGame" },
]

[[epic]]
id = 5
slug = "epic-store-pass"
title = "Store, Season Pass, faucet and sponsored actions"
covers = ["CAP-2", "CAP-23"]
after = [
  { epic = 4, needs = "PETV, its faucet allocation and the burn path" },
  { epic = 3, needs = "PotFunder for PotConverter output" },
  { epic = 2, needs = "voucher signer and the items the store sells first (food, eggs, shield on PetCore)" },
  { epic = 1, needs = "spike 2 answer: Gas Manager custom-rules webhook on 46630" },
]

[[epic]]
id = 6
slug = "epic-battle"
title = "Battles: attack, duel, 2v2, wager and dice"
covers = ["CAP-10", "CAP-11", "CAP-12"]
after = [
  { epic = 3, needs = "settle-before-change on point transfers between buckets" },
  { epic = 4, needs = "PETV stakes and burns for wager and dice" },
  { epic = 5, needs = "SeasonPass.isActive for the 10-minute cooldown and bought shields" },
]

