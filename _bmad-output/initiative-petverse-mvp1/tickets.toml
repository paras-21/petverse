# tickets.toml — the epics of initiative-petverse-mvp1 in build order. tickets.py reads it.
# The order of the tables is the build order; `id` names an epic for good and is never reused.
# `after` says what each epic needs and from which epic; the entries that wait on it carry the `after` at inception.

[[epic]]
id = 1
slug = "epic-platform"
title = "Platform baseline, governance and spikes"
covers = ["CAP-30"]

[[epic]]
id = 2
slug = "epic-pet-life"
title = "Log in, hatch and keep a pet alive"
covers = ["CAP-1", "CAP-3", "CAP-4", "CAP-5", "CAP-6"]
after = [
  { epic = 1, needs = "tracer path (login, 7702 smart account, sponsored call, indexer, generated chain module), governance base, Randomness service, Privy server auth, schema-per-environment" },
  { epic = 1, needs = "spike answers: wallet modes on 46630 and commit–reveal worker" },
]

[[epic]]
id = 3
slug = "epic-pot"
title = "Points, pot share and claim"
covers = ["CAP-7", "CAP-8", "CAP-9"]
after = [
  { epic = 2, needs = "PetCore with per-pet points, sleep/wake/bury hooks and the AD-16 status port" },
  { epic = 1, needs = "spike answer: per-owner two-level pot accumulator invariant (1.4), and the live governance base and worker (1.9, 1.15)" },
]

