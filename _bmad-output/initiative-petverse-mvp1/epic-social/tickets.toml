[[entry]]
id = 6
type = "story"
title = "Guild membership API: create, invite, join request, remove, leave"
description = "Adds the off-chain guild routes on the models from entry 1 (writer = API): any player not in a guild starts one and leads it, the leader shares a 7-day invite link and accepts or declines join requests, the leader removes members, a member leaves (a leaving leader passes the lead to the longest-standing member, the last member leaving closes the guild), with at most 10 members, one guild per player, unique names of 3–24 characters, a guild's average level from members' highest living pet and its War eligibility (at least 4 members with a living pet), both of which entry 9 reads, and a near-your-level guild list."
verify = "API tests on a test_ schema show an 11th join refused, a player in a guild refused by a second guild, a non-leader refused on remove, an expired invite refused, a join request accepted only by the leader, the near-level list ordered by average level, and the lead passing on the leader's leave."
covers = ["CAP-15"]
after = [1]
hitl = false
risk = "medium"
owns = ["src/server/guild/**", "src/app/api/guild/**"]
test = "src/server/guild/guild.test.ts"

