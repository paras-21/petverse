verify = "Component tests render each state from fixtures, and on a local node two test users see the Together bonus after both feed, one asks for an approval and the other agrees, then one leaves and the pet leaves their switcher while the badge shows in Profile."
covers = ["CAP-14"]
after = [3, 4, "3.8"]
