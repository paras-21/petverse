# tickets.toml — epic-social's agreed entries in build order. tickets.py reads it.
# The order of the tables is the build order; `id` names an entry for good and is never reused.
# Requirement ids are the spec's CAP ids (spec-petverse.md): CAP-14 Co-Pet, CAP-15 Guilds and Guild War.
# Lanes (never touch the same code): A = PetCore Co-Pet code (1 → 2 → 4); B = CoPetApprovals contract (3);
# C = Home Co-Pet screens (5); D = guild API (6) → Guild segment (7); E = Battle Guild War mode (8);
# F = worker War scheduler (9) → prize stream and payer (10) → War segment (11); live testnet step (12); sweep (13).
# Assumed numbers are marked in epic-social.md Notes (Decision lines, assumption, DECISIONS #31).

[[entry]]
id = 1
type = "story"
title = "Tracer: a Co-Pet invite link hatches a shared egg on 46630"
description = "Delivers the thinnest Co-Pet path through every layer: the inviter creates a 7-day single-use invite (CoPetInvite row, writer = API) from the Home \"add\" egg, the friend opens the link and accepts, the voucher signer signs a bounded hatchCoPet input, the friend's call makes PetCore mint a new free egg with `coOwner` set (PetCore lets either owner feed, play and enter battles with it), its own pot bucket (AD-4 bucket id), an `ownershipEpoch` that every later ownership change bumps, and an on-chain max-3 Co-Pets check per player; the indexer projects the co-owner and both pet switchers show the Co-Pet chip with the partner's avatar; it adds every Prisma model this epic needs (CoPetInvite, Guild, GuildMember, GuildInvite, GuildJoinRequest, GuildWar, GuildWarMatch) in one migration with a writer per model."
verify = "On 46630 player A creates an invite, player B opens the link and accepts, and within a minute both switchers show the Co-Pet with the partner's avatar, PetCore shows B as coOwner in a bucket of its own, both A and B can feed it, a fourth Co-Pet hatch for B reverts, and the used link shows \"This invite has ended\"."
covers = ["CAP-14"]
after = ["3.2", "4.6", "3.11", "4.9"]
hitl = true
risk = "high"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-17-co-pet-ownership-is-on-chain",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-4-pot-accounting-is-a-two-level-masterchef-accumulator-over-per-owner-effective-points",
  "_bmad-output/initiative-petverse-mvp1/ux-petverse/.working/key-home-copet.html",
]

[[entry]]
id = 2
type = "story"
title = "Co-Pet claims pay 50/50 and leave pays the leaver's half first"
description = "Adds the Co-Pet money paths in PetCore: a Co-Pet claim pays ETH owed + pending and accrued Gold half to each owner, and `leaveCoPet(petId)` (\"end\" is the same call, no price, no payment) runs the AD-17 order in one transaction — touch or bury, settle, leaver's half of unclaimed ETH and Gold to the leaver's pull balance (held by a payoutHold), close the Co-Pet bucket, clear coOwner and bump ownershipEpoch, move the pet (and NFT if the leaver held it) into the remaining owner's bucket, mint the leaver's soulbound memory badge, decrement both counts, emit CoPetLeft for the indexer and entry 5 — and extends epic-pot's randomized invariant test with Co-Pet start, claim and leave steps."
verify = "The chain/ contract tests pass, showing the leaver gets exactly half, the remaining owner's later claim gets the other half, the pet counts in the remaining owner's eff, the memory badge cannot be transferred, no function moves a Co-Pet NFT against payment, and the randomized run with Co-Pet steps keeps the AD-4 balance invariant."
covers = ["CAP-14"]
after = [1]
hitl = false
risk = "high"
owns = ["chain/contracts/PetCore.sol", "chain/contracts/interfaces/IPetCore.sol", "chain/contracts/CoPetMemoryBadge.sol", "chain/test/pot/PotInvariant.test.ts", "chain/test/social/CoPet.claim-leave.test.ts", "src/worker/indexer/handlers/CoPetLeft.ts"]
test = "chain/test/social/CoPet.claim-leave.test.ts"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-22-transfer-rules",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-24-game-gold-is-paid-from-a-funded-reserve-with-a-daily-cap",
  "docs/DECISIONS.md",
]

[[entry]]
id = 3
type = "story"
title = "Two-owner approvals: used once, expire, voided by any ownership change"
description = "Adds the CoPetApprovals contract (UUPS behind the timelock): each owner approves (petId, action, nonce, expiry) for a named action (breed, Death Match entry), a GAME_MODULE consumes the pair once, an approval past its 24-hour expiry or recorded under an older PetCore ownershipEpoch (added in entry 1, bumped by entry 2's leave) is void, a decline is recorded, and request / approve / decline events carry what epic-alerts and the Home card (entry 5) read; epic-growth and epic-death-match-raid call `consume` and build nothing of their own."
verify = "Contract tests show one owner's approval alone cannot be consumed, a pair is consumed once and a replay reverts, an approval after its expiry reverts, and a leave between approval and consume voids it."
covers = ["CAP-14"]
after = [2]
hitl = false
risk = "medium"
owns = ["chain/contracts/CoPetApprovals.sol", "chain/contracts/interfaces/ICoPetApprovals.sol", "chain/ignition/modules/CoPetApprovals.ts", "chain/test/social/CoPetApprovals.test.ts", "src/lib/chain/**"]
test = "chain/test/social/CoPetApprovals.test.ts"

[[entry]]
id = 4
type = "story"
title = "Together bonus and the shared streak"
description = "Adds to PetCore the per-owner last-fed UTC day for a Co-Pet, the Together bonus (once both owners have fed it on the same UTC day, PetCore adds 10% to the points it earns for the rest of that day, additive with the Pass +25%) and the shared streak (consecutive UTC days both fed; a day one owner misses resets it to 0), exposed in views and events for entry 5; it settles in epic-pot's order and raises lifetime points like any other gain (entry 3.3)."
verify = "Contract tests show only one owner feeding gives no bonus and keeps the streak, both feeding the same UTC day gives +10% on later points that day and grows the streak by 1, a missed day resets it, and a solo pet never gets the bonus."
covers = ["CAP-14"]
after = [2, "3.3"]
hitl = false
risk = "medium"
owns = ["chain/contracts/PetCore.sol", "chain/contracts/interfaces/IPetCore.sol", "chain/test/social/CoPet.together.test.ts"]
test = "chain/test/social/CoPet.together.test.ts"

