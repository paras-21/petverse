[[entry]]
id = 8
type = "story"
title = "Battle runs a Guild War 2v2 match from a signed pairing"
description = "Adds a Guild War match kind to epic-battle's Battle module: it takes a GUILD_WAR-signer-signed bounded input (warId, match number, two pets per side, expiry), re-checks both pets are alive and owned or co-owned by the named members, fights with the 2v2 engine and the Randomness service, moves no points, does not count toward the 5-a-day 2v2 limit, and emits GuildWarMatchSettled for the indexer and entry 9; the signed struct defined here is the one entry 9 signs."
verify = "Contract tests show a signed match settles once with its result checked against its commitment, an unsigned, expired or replayed input reverts, no pet's points change, and the 2v2 daily count is untouched."
covers = ["CAP-15"]
after = ["6.5"]
hitl = false
risk = "high"
owns = ["chain/contracts/Battle.sol", "chain/contracts/MatchArena.sol", "chain/contracts/interfaces/IBattle.sol", "chain/contracts/interfaces/IMatchArena.sol", "chain/contracts/libraries/GuildWarTicket.sol", "chain/test/social/Battle.guildWar.test.ts"]
test = "chain/test/social/Battle.guildWar.test.ts"

[[entry]]
id = 9
type = "story"
title = "Worker pairs guilds every Sunday and runs the best-of-5 series"
description = "Adds the Guild War job to the worker: at Sunday 00:00 UTC it freezes each guild's roster that is War-eligible by entry 6's rule, pairs guilds by entry 6's average level (sorted, adjacent pairs, odd one out gets a bye), opens 5 match slots (12:00, 14:00, 16:00, 18:00, 20:00 UTC) whose lineups members pick through an API route until 10 minutes before (each member at most 2 matches, no lineup = forfeit), signs each match as entry 8's struct, projects GuildWarMatchSettled results and closes a series at 3 wins (writers: GuildWar and GuildWarMatch = worker)."
verify = "A worker test on a local node and a test_ schema pairs 5 seeded guilds by average level with one bye, plays a series to 3–1 through entry 8, records a forfeit for an empty lineup, and refuses a third match for one member."
covers = ["CAP-15"]
after = [6, 8]
hitl = false
risk = "high"
owns = ["src/worker/guild-war/**", "src/worker/index.ts", "src/worker/indexer/handlers/GuildWarMatchSettled.ts", "src/server/signers/guild-war.ts", "src/app/api/guild-war/**"]
test = "src/worker/guild-war/guild-war.test.ts"

