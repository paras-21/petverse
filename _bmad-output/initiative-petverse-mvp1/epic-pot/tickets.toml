type = "story"
title = "Claims list with small-pot payouts and claim history"
description = "Adds Avatar menu › Claims, listing the player's open small-pot payouts (proof from entry 6's route, claimed on EpochDistributor) and past claims (adding the Claims item to the Avatar menu, creating the menu if epic-pet-life has not), and indexer handlers that write the Claim projection from PotClaimed and the small-pot claim event so the top-5% payout share is measurable."
