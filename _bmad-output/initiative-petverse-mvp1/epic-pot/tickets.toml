[[entry]]
id = 11
type = "story"
title = "Pot contracts upgraded on 46630 and a testnet bury recycles ETH"
description = "Upgrades PetCore (settle paths and level) and EpochDistributor on 46630 through a Safe-proposed timelocked upgrade, verifies them on Blockscout, regenerates the chain module, grants EPOCH_POSTER through the timelock, and runs one testnet bury of a pet holding pot ETH on epic-pet-life's shortened-timer test deploy."
verify = "Tx hashes on 46630 show the timelocked upgrade and role grant, the Blockscout source is verified, after the bury the pet's owed + pending ETH appears in PetCore's main accumulator with the AD-4 balance view still equal, and a claim on 46630 sets pot points to 0 while levelOf and lifetime points stay unchanged."
covers = ["CAP-8", "CAP-6"]
