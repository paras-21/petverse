[[entry]]
id = 10
type = "story"
title = "Failed deliveries are retried, logged and never shown as game errors"
description = "Adds a NotificationDelivery log (writer = notifier) per attempt, building on entry 8's `sentOutsideAt`, and retry with backoff for push and Telegram failures, removes a push subscription on 404/410, unlinks a Telegram chat that blocked the bot (403), honours Telegram's 429 retry_after, and keeps every failure out of the player's screens and out of game API responses (AD-19)."
verify = "Worker tests with fake channels show a 500 is retried then logged as failed, a 410 deletes the subscription, a 403 removes the TelegramLink, a 429 waits its retry_after, and no app route returns an error when a channel fails."
covers = ["CAP-27"]
after = [8]
hitl = false
risk = "medium"

