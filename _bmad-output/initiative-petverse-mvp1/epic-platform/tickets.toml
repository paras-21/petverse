[[entry]]
id = 13
type = "story"
title = "Governance base: UUPS modules behind a Safe-proposed 1-hour timelock, one role per key"
description = "Adds the shared upgradeable base (UUPS, ERC-7201 storage, PAUSER held by the Safe) and the Ignition module that wires a TimelockController (1 hour, Safe as proposer and canceller, open executor) as upgrade admin and parameter setter, with the single-role server keys granted only through it and their configVariable entries, using spike 3's Safe path."
