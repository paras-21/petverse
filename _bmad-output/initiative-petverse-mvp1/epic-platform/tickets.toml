[[entry]]
id = 11
type = "story"
title = "The server verifies every Privy token and keeps one User per Privy DID"
description = "Verifies the Privy access token (ES256, local verification key) on every API call and keeps a User row keyed by Privy DID holding its on-chain account address (the embedded wallet's own address under 7702, or the 4337 smart-account address from entry 12 for external wallets), with linking a second address only through an explicit link step."
verify = "API tests with a recorded-fixture token pass, a tampered or expired token gets a 401 with the standard error shape, and two logins with one DID leave one User row."
