references = ["_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-3-upgradeable-modules-behind-a-safe-proposed-timelock"]
notes = ["High risk: outside check = the adversarial review in the gate (DECISIONS #2) on the admin paths, and the testnet drill in entry 15."]

