id = 4
type = "story"
title = "Login streak: 10 points on days 1–6, an egg-shard on day 7, reset after a missed day"
description = "Adds a once-per-UTC-day check-in to Care that the app sends on the player's first open of the day, paying 10 points to the selected pet on days 1–6 and minting the soulbound egg-shard on day 7 (then a new 7-day cycle), resetting after a missed UTC day, with the StreakChecked handler and the flame streak chip in the phone top bar and the \"Day 4 streak\" pill in the desktop top nav."
