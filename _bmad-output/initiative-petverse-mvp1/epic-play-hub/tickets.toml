[[entry]]
id = 6
type = "story"
title = "Expedition module: Safe and Bold trips of 1, 8 or 24 hours"
description = "Adds the Expedition GAME_MODULE: one trip per pet at a time, refused while entry 2's inDeathMatchRun flag is set, setting entry 2's awayUntil and counting an expedition action; Safe pays 10 / 40 / 100 points on return; Bold escrows a PETV stake within the assumed bounds, takes its 30% fail roll from a commitment revealed at send (no recall exists, so the early reveal changes nothing), and on return pays 3× the Safe points and returns the stake, or burns the stake emitting Burned as a registered burn source."
verify = "Contract tests pin the three durations and Safe rewards, a Bold success returning the stake with 3× points, a Bold fail burning exactly the stake with one Burned event, a fixed-seed run giving a 30% fail band, a reveal timeout refunding the stake, no battle or second trip while away, and a send refused for a pet in a Death Match run."
covers = ["CAP-19"]
after = [2, 3, "1.16", "4.1"]
