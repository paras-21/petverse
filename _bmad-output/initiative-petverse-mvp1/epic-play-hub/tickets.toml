# tickets.toml — epic-play-hub's agreed entries in build order. tickets.py reads it.
# The order of the tables is the build order; `id` names an entry for good and is never reused.
# Requirement ids are the spec's CAP ids (spec-petverse.md); numbers marked "assumption" are in epic-play-hub.md Notes.
next_id = 15   # ids 8–12 moved to epic-death-match-raid (15.1–15.5) on 2026-10-14 and are never reused here

[[entry]]
id = 1
type = "story"
title = "Tracer: a daily wheel spin on a local node lands its prize on the Play hub wheel sheet"
description = "Delivers the thinnest path through every layer this epic touches: a Wheel GAME_MODULE that takes one free spin per player per rolling 24h through the Randomness service (AD-6) and pays the full prize table (50% 20 points, 25% one meal to PetCore's food balance, 15% 100 points, 8% random common cosmetic, 2% random rare cosmetic) to the selected pet, its own Ignition module file and generated-chain-module entry, a WheelSpun projection and API route, and the Play hub card registry (one file per activity card in epic-battle 6.11's Play tab shell, which also holds the Dice card, with the Wheel card filled and the other four cards as closed slots that entries 5 and 7 and epic-death-match-raid 15.2 and 15.5 fill) plus the wheel sheet (Spin a real button with aria-busy while spinning; under reduce motion or Calm motion the prize shows directly with no spin), prize card, \"Next spin in 23h 59m\" state, Home › Spin entry, with the spin's requestId on the prize card for epic-launch's fairness sheet (CAP-28)."
verify = "With app and worker running against a Hardhat local node, a test player taps Spin on the Play hub, sees the revealed prize on the prize card and the Wheel card turn to \"Next spin 23h\", a second spin inside 24h reverts, under reduced motion the prize shows with no spin animation, and a contract test with fixed seeds pins each prize band of the table."
covers = ["CAP-21"]
after = ["1.16", "2.4", "2.8", "6.11", "7.6"]
owns = ["chain/contracts/Wheel.sol","chain/contracts/interfaces/IWheel.sol","chain/ignition/modules/Wheel.ts","chain/test/Wheel.test.ts","src/lib/chain/**","src/worker/indexer/handlers/WheelSpun.ts","src/app/api/wheel/**","src/server/wheel/**","prisma/schema.prisma","prisma/migrations/**","src/components/play/cards/**","src/components/play/wheel/**","src/app/(game)/play/wheel/**","src/components/home/SpinEntry.tsx"]
test = "chain/test/Wheel.test.ts"
hitl = false
risk = "medium"
references = [
  "_bmad-output/initiative-petverse-mvp1/ux-petverse/.working/key-play-hub.html",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-6-commitreveal-randomness-bound-per-request-no-chain-entropy",
]

[[entry]]
id = 2
type = "story"
title = "PetCore play hooks: lives with care refill, away pets, game Gold and death in Death Match"
description = "Extends PetCore (upgrade-safe, ERC-7201) with the lives and death part of CAP-13, the away part of CAP-19 and the game-Gold part of CAP-20 that entries 4–7 and epic-death-match-raid 15.1–15.5 rely on: lives stored as lives lost so every pet starts with 3, refilled 1 per 7 consecutive good-care windows up to 3 with a TS port and shared vectors; an inDeathMatchRun flag that only DeathMatch (epic-death-match-raid 15.1) sets and clears and Expedition (entry 6) checks; an awayUntil timestamp in the PetCore eligibility view that Battle's settlement re-check (6.3) and MatchArena (6.5) call, adding that call there if missing, so an away pet is refused as attacker, duelist or 2v2 member; a GAME_MODULE awardGold that adds to the unpaid Gold counter epic-petv pays through creditFromGame; and a GAME_MODULE loseLife whose last life runs the AD-16 bury path (Tombstone, free egg, ETH recycle, Gold counter deleted); the battle and expedition counters already in PetCore (epic-pet-life) are incremented by entries 5 and 6 and epic-death-match-raid 15.1 and 15.4."
verify = "Contract tests show a fresh and an upgraded pet both at 3 lives, a life restored after exactly 7 good-care windows and not after 6 or past 3, an away pet refused by Battle at settlement, awarded Gold paid only up to the daily cap with the rest kept, and loseLife at 1 life burning the NFT and minting the Tombstone with the AD-4 invariant intact."
covers = ["CAP-13", "CAP-19", "CAP-20"]
after = ["2.6", "4.6", "6.3", "6.5", "6.13", "1.14"]
owns = ["chain/contracts/PetCore.sol","chain/contracts/interfaces/IPetCore.sol","chain/contracts/libraries/Lives.sol","chain/contracts/Battle.sol","chain/contracts/MatchArena.sol","chain/test/PetCore.play.test.ts","chain/test/vectors/lives-vectors.json","src/lib/lives.ts","src/lib/lives.test.ts"]
test = "chain/test/PetCore.play.test.ts"
hitl = false
risk = "high"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-16-life-cycle-comes-from-one-timestamp",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-24-game-gold-is-paid-from-a-funded-reserve-with-a-daily-cap",
]

[[entry]]
id = 3
type = "story"
title = "Play module interfaces, events and read models"
description = "Fixes the shared boundary the lanes build against: the I* interfaces and past-tense events of the Streak (on Care), Monster, Expedition, DeathMatch and Raid modules in chain/contracts/interfaces/, their Prisma projection models (including the Death Match leaderboard and Hall of Fame and raid team invites; random raid partners reuse epic-battle 6.4 MatchQueue with a raid mode added by epic-death-match-raid 15.5) with writer named and one migration, empty indexer handlers named after each event, each new contract's generated-chain-module entry built from the interfaces (lanes then only fill addresses through their own Ignition files), and one usePetAvailability hook (away, dead, in a Death Match run, not adult) from entry 2's PetCore views, wired here into the Play card-registry slot and the Home and Battle action buttons (2.8, 6.9, 6.10) as cooldown-style buttons, with entry 7 adding only the expedition copy, so entries 4–7 and epic-death-match-raid 15.1–15.5 add only their own contract, handler body and screens."
verify = "The gate passes with the interfaces compiling, the migration applying to a fresh test_ schema, a worker test feeding one synthetic log of each new event to its handler without error, and a hook test reading an away pet as unavailable on a local node."
covers = ["CAP-13", "CAP-19", "CAP-20", "CAP-21"]
