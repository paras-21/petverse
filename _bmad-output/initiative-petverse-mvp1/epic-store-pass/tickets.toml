# tickets.toml — epic-store-pass's agreed entries in build order. tickets.py reads it.
# The order of the tables is the build order; `id` names an entry for good and is never reused.
# Requirement ids are the spec's CAP ids (spec-petverse/spec-petverse.md); numbers are in spec-petverse/game-rules.md, Money and Seasons.
# Lanes: A price source, Store and PotConverter contracts (1 → 6, 1 → 9); B quote service (1 → 8); C gas webhook and paid fallback (2 → 3);
# D Faucet (4 → 5); E SeasonPass and PetCore (10 → 11, after 6); F Shop screens (1 → 7 → 12); then deploy (13) and sweep (14).

[[entry]]
id = 1
type = "story"
title = "Tracer: buy food for $1 in PETV at a signed rate on a local node"
description = "Delivers the thinnest path through contract, signer, deploy and screen: the IPriceSource port (petvPerUsd, weiPerUsd, burnStageBps) with the upgradeable SignedRateSource accepting an EIP-712 QUOTE_SIGNER quote (expiry, nonce, at most 5% move per hour from the last accepted rate, burn stage only 7000/5000/3000), an upgradeable Store whose registry holds Food at 100 USD cents that converts at the accepted quote, burns the burn-stage share emitting `Burned` (registered as a burn source), sends half the rest to a receive-only PotConverter and half to the team address and credits one meal to PetCore's food balance, a quote route signing at 70% from the PETV/USD display rate, each contract's own Ignition module and generated-chain-module entry, and a Shop tab with Shop › Store showing Food dollars first and buying it through the GameWallet port; entries 6, 8 and 9 build on these contracts and route."
verify = "With app and worker on a Hardhat local node, a logged-in player opens Shop › Store, sees Food at $1 over its PETV amount, buys it and the food count rises by one, and contract tests show 70% of the PETV burned with `Burned`, 15% held by PotConverter, 15% at the team address, and an expired, replayed or 6%-moved quote reverting."
covers = ["CAP-23"]
after = ["1.6", "1.7", "1.11", "1.12", "1.13", "2.3", "2.4", "2.6", "3.3", "4.6", "4.7"]
hitl = true
risk = "high"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-10-dollar-pricing-through-one-price-source-port-with-bounded-signers",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-11-revenue-in-petv-reaches-the-eth-pot-only-through-potconverter",
  "_bmad-output/initiative-petverse-mvp1/ux-petverse/.working/key-shop-claim.html",
]
notes = [
  "hitl steps: the owner puts a dev QUOTE_SIGNER key in the local env (never printed or committed).",
  "High risk: outside check = the adversarial review in the gate (DECISIONS #2) on quote replay, the rate-move bound and the burn-stage source.",
]

[[entry]]
id = 2
type = "story"
title = "Gas webhook: 10 sponsored actions a day per player, 20 with the Pass, fail closed"
description = "Adds `/api/gas/approve` as the Gas Manager custom-rules webhook: it verifies Alchemy's signature, maps `userOperation.sender` to a Privy DID through the User row, approves only a single call to an allow-listed game contract, counts approvals per DID per UTC day in a SponsorshipCount model (single writer: this route) against a cap of 10, or 20 while `ISeasonPass.isActive` is true (the interface and a test double defined here; entry 10 implements it), sponsors calls to an uncounted list (the Faucet, from entry 4) without counting, refuses on any error, and serves the player's remaining count from `/api/gas/remaining` for entry 3."
verify = "Route tests with recorded Gas Manager fixtures approve a DID's first 10 single-call operations of a UTC day and refuse the 11th, a batch, a non-allow-listed target, a bad signature, an unknown sender and a database error, approve up to 20 when the SeasonPass double is active, and on a Vercel preview against 46630 the 11th tracer action of the day is refused by the live policy."
covers = ["CAP-2"]
after = [1, "1.2", "1.8", "1.10", "1.11"]
hitl = true
risk = "high"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-7-gas-sponsorship-cap-is-enforced-by-our-gas-manager-webhook",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-8-wallet-and-identity",
]
notes = [
  "hitl steps: the owner sets the custom-rules webhook URL on the Gas Manager policy with approveOnFailure off, and enters the webhook signing key in Vercel's preview env (never printed or committed).",
  "High risk: outside check = the security review in the gate on signature verification and fail-closed paths.",
]

[[entry]]
id = 3
type = "story"
title = "Past the cap: the paid fallback, the free-actions chip and the no-test-ETH state"
description = "When entry 2's remaining count is 0, sends the same call unsponsored through the GameWallet port after a fee confirm that shows the fee in dollars first (gas estimate × fee × epic-pot's ETH/USD rate), adds the top-bar free-actions chip (\"7 free left\", \"0 free · small fee\", polite announcement on change) and the no-test-ETH fee confirm with \"Get test ETH\" opening the Wallet sheet and the reset time, spending nothing."
verify = "On a local node with the webhook fixture at the cap, the 11th action shows its fee in dollars, goes through paid from test ETH and the chip reads \"0 free · small fee\", the chip shows \"10 free left\" again after the UTC day turns, and with no test ETH the fee confirm offers \"Get test ETH\" and the reset time and sends nothing."
covers = ["CAP-2"]
after = [2, 5, "1.12", "2.3", "3.7"]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-petverse-mvp1/ux-petverse/EXPERIENCE.md"]

[[entry]]
id = 4
type = "story"
title = "Faucet: sign-up and daily drips against a voucher per Privy DID"
description = "Adds the upgradeable testnet Faucet behind the timelock paying 0.01 test ETH + 3,120 PETV once per DID hash at sign-up and 0.002 test ETH + 624 PETV once per DID hash per UTC day (amounts timelocked parameters), only against a VOUCHER_SIGNER voucher (kind, DID hash, recipient, UTC day, expiry, nonce) from a faucet route next to epic-pet-life's voucher route, receiving team test-ETH top-ups and refusing with a plain reason when empty, with its own Ignition module; entry 5 calls it and entry 2 lists it as uncounted."
verify = "Contract and route tests show a sign-up voucher pays 0.01 test ETH + 3,120 PETV once per DID, a daily voucher pays 0.002 test ETH + 624 PETV once per DID per UTC day, a reused, expired, wrong-recipient or unsigned voucher and a logged-out request are refused, an empty faucet refuses, and only the timelock changes the amounts."
covers = ["CAP-2"]
after = ["1.11", "1.13", "2.7", "4.1"]
hitl = false
risk = "high"
references = [
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-9-petv-on-testnet-fixed-supply-token-our-pons-like-curve-one-tax-splitter",
  "_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-15-anti-bot-uses-off-chain-detection-and-a-narrow-on-chain-hold",
]
notes = ["High risk: outside check = the adversarial review in the gate on voucher replay and per-DID caps."]

[[entry]]
id = 5
type = "story"
title = "Wallet sheet faucet: the sign-up drip and \"Get today's $2\" with its countdown"
description = "Adds the faucet to epic-petv's Wallet sheet: the sign-up drip is claimed automatically after the first login (with a retry button if it fails), the daily button shows the live dollar value of the drip and becomes a cooldown button counting down to 00:00 UTC once used, with pending, error and empty-faucet copy, and exposes the faucet section as the target that entries 3, 7 and 12 open."
verify = "On a local node a new login receives the sign-up drip without tapping, and on the next UTC day the Wallet sheet button pays the daily drip and turns into a cooldown button counting down to 00:00 UTC, at 390px and 1280px."
covers = ["CAP-2"]
after = [4, "4.8"]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-petverse-mvp1/ux-petverse/DESIGN.md"]

[[entry]]
id = 6
type = "story"
title = "Store registry: eggs and the 8-hour shield, open to later items"
description = "Grows entry 1's Store into the full registry: Egg (299 cents) and Lucky egg (999 cents) mint a paid egg through a new PetCore entry point with its tier, whose hatch reveal uses that tier's coat weights (the Lucky egg triples the rarest palettes' weight, a timelocked parameter), Shield (8h, 100 cents) sets the pet's shield-until (epic-pet-life 2.2's field) through a GAME_MODULE extend-only shield setter this entry adds to PetCore, the one setter epic-battle 6.3 also calls (this entry is the only one that builds paid eggs and the Shield), every price is a timelocked USD-cents parameter, and later epics register items (evolution items, cosmetics) through the timelock with a target contract and call, so epic-growth and epic-cosmetics-market add items without editing Store."
verify = "Contract tests buy each item at a signed rate (a meal credited, an Egg and a Lucky egg minted with their tier and a seeded run of Lucky-egg reveals showing the rarest palettes at three times the Egg rate, a pet's shield set to now + 8 hours), show only the timelock can change a price or register an item, and the AD-4 invariant and upgrade-safety validator stay clean after the PetCore change."
covers = ["CAP-23"]
after = [1]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-2-petcore-is-the-single-ledger-modules-are-spokes"]

