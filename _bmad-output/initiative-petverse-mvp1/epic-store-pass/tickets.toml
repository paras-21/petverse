[[entry]]
id = 8
type = "story"
title = "The quote service sets the burn stage from the 30-minute market cap and stays inside the bound"
description = "Hardens entry 1's quote route: burnStageBps comes from the 30-minute average market cap (PETV/USD × 1B supply: 7000 below $1M, 5000 from $1M, 3000 from $10M, thresholds in GameConfig), quotes expire after 5 minutes with an on-chain nonce, a market move past 5% in an hour is signed at the bound so buys keep working, the route is rate-limited per DID, and the QUOTE_SIGNER key is loaded only through the env loader and never logged."
verify = "Route tests sign 7000 below a $1M average, 5000 above it and 3000 above $10M, sign a rate at exactly the 5%-per-hour bound when the market moved further, and a log-capture test finds no key material."
covers = ["CAP-23"]
after = [1]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-18-every-economy-number-is-a-parameter-with-one-home"]

[[entry]]
id = 9
type = "story"
title = "PotConverter swaps queued PETV to ETH for PotFunder"
description = "Turns entry 1's receive-only PotConverter into the AD-11 converter: a KEEPER-only batch swap of queued PETV to ETH through the curve before graduation and the pool after, with a minimum-out from IPriceSource's weiPerUsd and petvPerUsd less the 5% trade tax and a timelocked slippage allowance, the ETH sent to epic-pot's PotFunder, plus the keeper job in the worker that runs it on a schedule and when the queue passes a threshold."
verify = "Worker tests on a local node show the job swapping queued PETV through the curve and, after graduation, the pool, PotFunder's balance rising by the ETH received, a swap below the minimum-out reverting, and a non-KEEPER call reverting."
covers = ["CAP-23"]
after = [1, "1.9", "3.1", "4.3"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-petverse-mvp1/architecture-petverse/architecture-petverse.md#ad-11-revenue-in-petv-reaches-the-eth-pot-only-through-potconverter"]
notes = ["High risk: outside check = the adversarial review in the gate on minimum-out and sandwich exposure."]

[[entry]]
id = 10
type = "story"
title = "SeasonPass: on-chain seasons and a $7.99 pass with no auto-renew"
description = "Adds the upgradeable SeasonPass implementing entry 2's ISeasonPass: season genesis and 12-week length as timelocked parameters behind `seasonOf(ts)` and `isActive(addr, ts)`, a buy of the current season at 799 cents through entry 1's price source that lasts to that season's end with no renewal and one pass per address per season, income split 30% to PotConverter, 20% to epic-pot's seasonPool stream and 50% to team in the same transaction, and a grant of the current season's skin on buy through the Cosmetics base's granter interface (epic-pet-life 2.5), the skin id a timelocked per-season SeasonPass parameter left unset (no skin) until epic-cosmetics-market 7.5 defines the soulbound skin id and its granter role and epic-seasons sets the id each season (10.8, 10.10), with its own Ignition module."
verify = "Contract tests show seasonOf and isActive following genesis and the 12-week length at the exact boundaries, a $7.99 buy making isActive true until the season's end and false after, a second buy in the same season reverting, the 30/20/50 split, and the season skin minted and refusing transfer."
