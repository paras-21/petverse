description = "Builds Shop › Store from key-shop-claim.html on entry 6's registry: item tiles dollars first with PETV underneath, the detail and Buy area, the wallet chip opening the Wallet sheet, pending and error states, and the shared shortfall note (Buy becomes a focusable \"Not enough PETV\"; \"You need $1.40 more\" over the PETV gap; \"Get today's $2\" or \"Open Wallet\" with the next-drip time, opening entry 5's faucet section and returning to the same item) that entry 12 and later epics reuse."
verify = "At 390px and 1280px against a local node, Shop › Store lists Food, Egg, Lucky egg and Shield dollars first, a buy succeeds, and with too little PETV the note states the gap in dollars and its button opens the Wallet sheet faucet and returns to the same item, all reachable by keyboard."
